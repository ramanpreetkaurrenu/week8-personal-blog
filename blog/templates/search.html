{% extends "base.html" %}

{% block title %}
Search
{% endblock %}

{% block content %}

<h2>
Search Results
</h2>

<p>
Results for:
<strong>{{ query }}</strong>
</p>


{% for post in posts %}

<div class="card mb-3">

<div class="card-body">

<h3>
{{ post.title }}
</h3>

<p>
{{ post.content[:200] }}...
</p>

<a
href="{{ url_for(
    'main.post_detail',
    post_id=post.id
) }}"
class="btn btn-primary">

Read More

</a>

</div>

</div>

{% else %}

<div class="alert alert-warning">
No results found.
</div>

{% endfor %}

{% endblock %}
